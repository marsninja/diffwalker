[project]
name = "diffwalker"

# Deployment values for the apps archwire.jac declares. Each is baked into the
# artifact and can be overridden by its environment variable (`neojac build`
# lists them).
[spaces.site]
npm = "web"

[spaces.phone]
npm = "mobile"

# The desktop app's pages in a native window, against a diffwalker server; its
# `local` profile (archwire.jac) runs diffwalker in the window's own program.
[apps.desktop]
name = "diffwalker"
identifier = "dev.diffwalker.desktop"
# The one desktop program runs either way, and its user chooses which at first launch
# and from the sidebar: `default` against a diffwalker server, `local` on this computer.
profiles = ["default", "local"]
# On this computer there is no sign-in: named profiles, each its own root.
local_users = true

[apps.desktop.window]
title = "diffwalker"
width = 1440
height = 900
min_width = 1024
min_height = 680

[apps.desktop.remote]
api = "http://127.0.0.1:8000"

# The phone app as Android installs it.
[apps.mobile]
name = "diffwalker"
identifier = "dev.diffwalker.mobile"

[apps.mobile.remote]
api = "http://127.0.0.1:8000"

[apps.cli.remote]
api = "http://127.0.0.1:8000"

# What `neojac install` fetches to build and run the phone app for Android: the SDK (under
# Google's licenses, which this says the project accepts) and an emulator to run it on.
[android]
licenses = "accepted"
emulator = true

[llm]
model = "claude-sonnet-5-5"

[check.lint]
select = ["style"]

[npm.web]
name = "diffwalker"
private = true
type = "module"

[npm.web.dependencies]
"@fontsource-variable/geist" = "^5.2.5"
"@fontsource-variable/geist-mono" = "^5.2.5"
"@hugeicons/core-free-icons" = "^4.2.3"
"@hugeicons/react" = "^1.1.9"
class-variance-authority = "^0.7.1"
clsx = "^2.1.1"
lucide-react = "^0.469.0"
mermaid = "^11"
radix-ui = "^1.4.2"
react = "^19.1.0"
react-dom = "^19.1.0"
react-native-web = "^0.21.2"
react-router-dom = "^7.6.0"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[npm.web.devDependencies]
"@tailwindcss/vite" = "^4.1.17"
"@vitejs/plugin-react" = "^5.0.0"
tailwindcss = "^4.1.17"
vite = "^7.1.0"

[npm.mobile]
name = "diffwalker_mobile"
private = true

[npm.mobile.dependencies]
expo = "~54.0.0"
react = "19.1.0"
react-native = "0.81.5"
lucide-react-native = "^1.70.0"
react-native-svg = "^15.13.0"
react-native-safe-area-context = "~5.6.0"
