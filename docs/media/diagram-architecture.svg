<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="Architecture: web, mobile and CLI clients call core/api.jac through typed RPC; the server&#x27;s copilot and review engine call the LLM provider, commit to the graph store, and read the local repo via git and gh.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ecebf3}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b9b6c9}
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8a879c}
  .flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a879c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c5cff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1baf7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e66767"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><rect width="1180" height="560" rx="18" fill="#0f0e15"/><rect width="1180" height="560" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="1179" height="559" rx="18" fill="none" stroke="#2c2a38"/><text x="34" y="50" class="t" font-size="26" font-weight="700" text-anchor="start" >Three apps, one Jac codebase</text><text x="34" y="76" class="s" font-size="16.5" font-weight="400" text-anchor="start" >No client or server folders: where each declaration runs is inferred, and client calls compile to typed RPC stubs.</text><rect x="34" y="100" width="220" height="410" rx="16" fill="none" stroke="#2c2a38" stroke-width="1" stroke-dasharray="4 5"/><text x="50" y="124" class="s" font-size="13.5" font-weight="700" text-anchor="start" letter-spacing="1.5">CLIENT APPS</text><rect x="300" y="100" width="560" height="410" rx="16" fill="none" stroke="#2c2a38" stroke-width="1" stroke-dasharray="4 5"/><text x="316" y="124" class="s" font-size="13.5" font-weight="700" text-anchor="start" letter-spacing="1.5">core/  ·  JAC SERVER</text><rect x="906" y="100" width="240" height="410" rx="16" fill="none" stroke="#2c2a38" stroke-width="1" stroke-dasharray="4 5"/><text x="922" y="124" class="s" font-size="13.5" font-weight="700" text-anchor="start" letter-spacing="1.5">OUTSIDE</text><rect x="52" y="150" width="184" height="74" rx="12" fill="#132a45" stroke="#3987e5" stroke-width="1.3" /><text x="70" y="180" class="m" font-size="17" font-weight="650" text-anchor="start" fill="#ecebf3" >web/</text><text x="70" y="202" class="s" font-size="14.5" font-weight="400" text-anchor="start" >React SPA (Jac JSX)</text><rect x="52" y="270" width="184" height="74" rx="12" fill="#132a45" stroke="#3987e5" stroke-width="1.3" /><text x="70" y="300" class="m" font-size="17" font-weight="650" text-anchor="start" fill="#ecebf3" >mobile/</text><text x="70" y="322" class="s" font-size="14.5" font-weight="400" text-anchor="start" >mobUI → React Native</text><rect x="52" y="390" width="184" height="74" rx="12" fill="#132a45" stroke="#3987e5" stroke-width="1.3" /><text x="70" y="420" class="m" font-size="17" font-weight="650" text-anchor="start" fill="#ecebf3" >cli/</text><text x="70" y="442" class="s" font-size="14.5" font-weight="400" text-anchor="start" >in-process or --live</text><rect x="320" y="146" width="244" height="64" rx="12" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="336" y="173" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >api.jac</text><text x="336" y="193" class="s" font-size="14.5" font-weight="400" text-anchor="start" >authenticated endpoints + SSE</text><rect x="600" y="146" width="244" height="64" rx="12" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="616" y="173" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >live.jac</text><text x="616" y="193" class="s" font-size="14.5" font-weight="400" text-anchor="start" >per-user event bus</text><rect x="320" y="236" width="244" height="64" rx="12" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="336" y="263" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >agent/copilot.jac</text><text x="336" y="283" class="s" font-size="14.5" font-weight="400" text-anchor="start" >by llm(), 29 tools</text><rect x="600" y="236" width="244" height="64" rx="12" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="616" y="263" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >review/engine.jac</text><text x="616" y="283" class="s" font-size="14.5" font-weight="400" text-anchor="start" >8-stage walker pipeline</text><rect x="320" y="326" width="244" height="64" rx="12" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="336" y="353" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >actions.jac</text><text x="336" y="373" class="s" font-size="14.5" font-weight="400" text-anchor="start" >writes shared with buttons</text><rect x="600" y="326" width="244" height="64" rx="12" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="616" y="353" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >graph.jac</text><text x="616" y="373" class="s" font-size="14.5" font-weight="400" text-anchor="start" >nodes · typed edges · walkers</text><rect x="320" y="416" width="244" height="64" rx="12" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="336" y="443" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >analytics.jac</text><text x="336" y="463" class="s" font-size="14.5" font-weight="400" text-anchor="start" >history mining</text><rect x="600" y="416" width="244" height="64" rx="12" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="616" y="443" class="m" font-size="15.5" font-weight="650" text-anchor="start" fill="#ecebf3" >git/</text><text x="616" y="463" class="s" font-size="14.5" font-weight="400" text-anchor="start" >git · gh · diff parser</text><rect x="924" y="236" width="204" height="64" rx="12" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="940" y="263" class="t" font-size="16.5" font-weight="650" text-anchor="start" >LLM provider</text><text x="940" y="283" class="s" font-size="14.5" font-weight="400" text-anchor="start" >via byLLM → LiteLLM</text><rect x="924" y="326" width="204" height="64" rx="12" fill="#132a45" stroke="#3987e5" stroke-width="1.3" /><text x="940" y="353" class="t" font-size="16.5" font-weight="650" text-anchor="start" >Graph store</text><text x="940" y="373" class="s" font-size="14.5" font-weight="400" text-anchor="start" >per-request commit</text><rect x="924" y="416" width="204" height="64" rx="12" fill="#11302a" stroke="#1baf7a" stroke-width="1.3" /><text x="940" y="443" class="t" font-size="16.5" font-weight="650" text-anchor="start" >Local repo + gh</text><text x="940" y="463" class="s" font-size="14.5" font-weight="400" text-anchor="start" >the code under review</text><path d="M236,182 L318,178" fill="none" stroke="#7c5cff" stroke-width="1.9" class="flow" marker-end="url(#av)"/><text x="277" y="168" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#7c5cff" stroke="#0f0e15" stroke-width="6" paint-order="stroke">typed RPC</text><path d="M236,300 C276,300 280,196 318,192" fill="none" stroke="#3987e5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="250" y="262" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">same stubs</text><path d="M236,420 C284,420 284,206 318,202" fill="none" stroke="#8a879c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="250" y="372" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">--live</text><path d="M236,444 L318,444" fill="none" stroke="#8a879c" stroke-width="1.3" marker-end="url(#a)"/><text x="277" y="436" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">import</text><path d="M564,178 L598,178" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M442,210 L442,234" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M564,268 L598,268" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M720,234 L720,212" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><text x="728" y="227" class="m" font-size="12.5" font-weight="400" text-anchor="start" fill="#8a879c" >events</text><path d="M564,358 L598,358" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M442,300 L442,324" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M844,268 L922,268" fill="none" stroke="#7c5cff" stroke-width="1.9" class="flow" marker-end="url(#av)"/><text x="883" y="260" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#7c5cff" stroke="#0f0e15" stroke-width="6" paint-order="stroke">by llm()</text><path d="M844,358 L922,358" fill="none" stroke="#3987e5" stroke-width="1.5" marker-end="url(#a)"/><text x="883" y="350" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">commit</text><path d="M844,448 L922,448" fill="none" stroke="#1baf7a" stroke-width="1.5" marker-end="url(#ag)"/><text x="883" y="440" class="m" font-size="13" font-weight="400" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">git</text><path d="M564,448 L598,448" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><path d="M720,300 L720,324" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><text x="34" y="538" class="s" font-size="14.5" font-weight="400" text-anchor="start" >Imports between modules are declared once in archwire.jac; every endpoint is def:protect, so each account works in its own graph.</text></svg>