ll="#0f0e15" stroke="#2c2a38" stroke-width="1" /><text x="588" y="240" class="m" font-size="13" font-weight="500" text-anchor="middle" fill="#1baf7a" >CalledFrom / TestedBy</text><path d="M520,340 C590,340 590,386 658,386" fill="none" stroke="#8a879c" stroke-width="1.6" marker-end="url(#a)"/><rect x="558.3" y="359" width="63.400000000000006" height="24" rx="7" fill="#0f0e15" stroke="#2c2a38" stroke-width="1" /><text x="590" y="376" class="m" font-size="13" font-weight="500" text-anchor="middle" fill="#b9b6c9" >Raised</text><circle r="11" fill="#7c5cff" opacity=".25"><animateMotion dur="4.2s" repeatCount="indefinite" path="M210,235 C270,235 270,170 328,170 L520,170 L520,190 C590,190 590,282 658,282" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear"/></circle><circle r="6" fill="#7c5cff" stroke="#fff" stroke-width="1.5"><animateMotion dur="4.2s" repeatCount="indefinite" path="M210,235 C270,235 270,170 328,170 L520,170 L520,190 C590,190 590,282 658,282" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear"/></circle><rect x="890" y="120" width="256" height="236" rx="14" fill="#17161f" stroke="#7c5cff" stroke-width="1.4" /><text x="908" y="148" class="m" font-size="15" font-weight="650" text-anchor="start" fill="#7c5cff" >walker Investigate</text><text x="908" y="178" class="m" font-size="13.5" font-weight="600" text-anchor="start" fill="#ecebf3" >FileChange entry</text><text x="920" y="196" class="m" font-size="13.5" font-weight="400" text-anchor="start" fill="#b9b6c9" >visit [here--&gt;][?:CodeRef]</text><text x="920" y="216" class="m" font-size="13.5" font-weight="400" text-anchor="start" fill="#b9b6c9" >by llm(select=(1, 3))</text><text x="908" y="236" class="m" font-size="13.5" font-weight="600" text-anchor="start" fill="#ecebf3" >CodeRef entry</text><text x="920" y="254" class="m" font-size="13.5" font-weight="400" text-anchor="start" fill="#b9b6c9" >read the excerpt,</text><text x="920" y="274" class="m" font-size="13.5" font-weight="400" text-anchor="start" fill="#b9b6c9" >attach it as evidence</text><line x1="908" y1="290" x2="1128" y2="290" stroke="#2c2a38"/><text x="908" y="312" class="s" font-size="14.5" font-weight="400" text-anchor="start" >The model chooses which related</text><text x="908" y="329" class="s" font-size="14.5" font-weight="400" text-anchor="start" >code to read; the verifier sees it.</text><text x="34" y="448" class="s" font-size="14.5" font-weight="400" text-anchor="start" >Other walkers: ReviewRun drives the pipeline (Review entry → FileChange entry → Review exit); CollectFindings feeds the dashboard.</text></svg>