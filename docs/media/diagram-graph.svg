<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="Review node covers FileChange nodes, which raise Findings and link to CodeRefs; the Investigate walker visits CodeRefs chosen by the model.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ecebf3}
