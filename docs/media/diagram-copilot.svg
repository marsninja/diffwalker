<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="Sequence of one Copilot turn: the pane streams a message, a worker runs the by llm tool loop, UI tools emit session-tagged events the app shell applies, writes are committed through the request context, and the answer streams back.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ecebf3}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b9b6c9}
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8a879c}
  .flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a879c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c5cff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1baf7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e66767"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><rect width="1180" height="560" rx="18" fill="#0f0e15"/><rect width="1180" height="560" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="1179" height="559" rx="18" fill="none" stroke="#2c2a38"/><text x="34" y="50" class="t" font-size="22" font-weight="700" text-anchor="start" >One Copilot turn</text><text x="34" y="76" class="s" font-size="14" font-weight="400" text-anchor="start" >Every tool that changes the screen becomes an event the UI applies, so you watch the agent work.</text><rect x="36" y="100" width="148" height="38" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="110" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >Copilot pane</text><line x1="110" y1="140" x2="110" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="228" y="100" width="148" height="38" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="302" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >copilot_stream</text><line x1="302" y1="140" x2="302" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="420" y="100" width="148" height="38" rx="10" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="494" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >by llm() loop</text><line x1="494" y1="140" x2="494" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="612" y="100" width="148" height="38" rx="10" fill="#2a2347" stroke="#7c5cff" stroke-width="1.3" /><text x="686" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >Tools</text><line x1="686" y1="140" x2="686" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="804" y="100" width="148" height="38" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="878" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >Live bus</text><line x1="878" y1="140" x2="878" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="996" y="100" width="148" height="38" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.3" /><text x="1070" y="124" class="t" font-size="13" font-weight="600" text-anchor="middle" >App shell</text><line x1="1070" y1="140" x2="1070" y2="510" stroke="#2c2a38" stroke-dasharray="3 5"/><rect x="398" y="222" width="728" height="214" rx="12" fill="none" stroke="#7c5cff" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/><rect x="398" y="222" width="160" height="22" rx="10" fill="#2a2347" stroke="#7c5cff" stroke-width="1" /><text x="478" y="237" class="m" font-size="10.5" font-weight="600" text-anchor="middle" fill="#7c5cff" >loop until it answers</text><path d="M116,176 L296,176" fill="none" stroke="#8a879c" stroke-width="1.4" marker-end="url(#a)"/><text x="206.0" y="168" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">message + what you are looking at</text><path d="M308,204 L488,204" fill="none" stroke="#8a879c" stroke-width="1.4" marker-end="url(#a)"/><text x="398.0" y="196" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">run the turn in a worker</text><path d="M500,268 L680,268" fill="none" stroke="#7c5cff" stroke-width="1.8" class="flow" marker-end="url(#av)"/><text x="590.0" y="260" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#ecebf3" stroke="#0f0e15" stroke-width="6" paint-order="stroke">tool call: focus_file(path, line)</text><path d="M692,300 L872,300" fill="none" stroke="#7c5cff" stroke-width="1.8" class="flow" marker-end="url(#av)"/><text x="782.0" y="292" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#ecebf3" stroke="#0f0e15" stroke-width="6" paint-order="stroke">ui event, tagged with your session</text><path d="M884,332 L1064,332" fill="none" stroke="#7c5cff" stroke-width="1.8" class="flow" marker-end="url(#av)"/><text x="974.0" y="324" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#ecebf3" stroke="#0f0e15" stroke-width="6" paint-order="stroke">SSE → navigate, scroll</text><path d="M680,370 L308,370" fill="none" stroke="#b9b6c9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="494.0" y="362" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">writes go through pump.call() → commit()</text><path d="M488,410 L116,410" fill="none" stroke="#b9b6c9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="302.0" y="402" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">tool chips · chart cards (streamed frames)</text><path d="M488,476 L116,476" fill="none" stroke="#b9b6c9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="302.0" y="468" class="m" font-size="11.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" stroke="#0f0e15" stroke-width="6" paint-order="stroke">final answer, token by token</text><circle cx="1070" cy="332" r="12" fill="none" stroke="#7c5cff" stroke-width="2" class="pulse"/><text x="34" y="540" class="s" font-size="12" font-weight="400" text-anchor="start" >Parallel lookups, serialized writes, a Stop button and a per-turn budget (DIFFWALKER_TURN_BUDGET). Publishing to GitHub always waits for your click.</text></svg>