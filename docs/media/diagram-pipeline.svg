<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 452" width="1180" height="452" role="img" aria-label="Eight-stage review pipeline: ingest and triage are deterministic; plan, parallel lenses, cross-file, investigate, verify and synthesize are typed LLM calls. The verifier drops false positives.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ecebf3}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b9b6c9}
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8a879c}
  .flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a879c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c5cff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1baf7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e66767"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><rect width="1180" height="452" rx="18" fill="#0f0e15"/><rect width="1180" height="452" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="1179" height="451" rx="18" fill="none" stroke="#2c2a38"/><text x="34" y="50" class="t" font-size="26" font-weight="700" text-anchor="start" >The review pipeline</text><text x="34" y="76" class="s" font-size="16.5" font-weight="400" text-anchor="start" >Eight stages, each committed to the graph as it finishes, so every open screen follows along.</text><rect x="740" y="38" width="14" height="14" rx="4" fill="#11302a" stroke="#1baf7a" stroke-width="1.2" /><text x="762" y="50" class="s" font-size="14.5" font-weight="400" text-anchor="start" >deterministic Jac</text><rect x="888" y="38" width="14" height="14" rx="4" fill="#2a2347" stroke="#7c5cff" stroke-width="1.2" /><text x="910" y="50" class="s" font-size="14.5" font-weight="400" text-anchor="start" >typed by llm() call</text><rect x="1048" y="38" width="14" height="14" rx="4" fill="#3a1717" stroke="#e66767" stroke-width="1.2" /><text x="1070" y="50" class="s" font-size="14.5" font-weight="400" text-anchor="start" >rejections</text><rect x="34" y="168" width="134" height="86" rx="14" fill="#11302a" stroke="#1baf7a" stroke-width="1.4" /><circle cx="54" cy="190" r="11" fill="#0f0e15" stroke="#1baf7a"/><text x="54" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1baf7a" >1</text><text x="71" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Ingest</text><text x="48" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >git diff → FileDiff</text><text x="48" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M170,211.0 L174,211.0" fill="none" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#ag)"/><rect x="176" y="168" width="134" height="86" rx="14" fill="#11302a" stroke="#1baf7a" stroke-width="1.4" /><circle cx="196" cy="190" r="11" fill="#0f0e15" stroke="#1baf7a"/><text x="196" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1baf7a" >2</text><text x="213" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Triage</text><text x="190" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >risk + CodeRefs</text><text x="190" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M312,211.0 L316,211.0" fill="none" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#ag)"/><rect x="318" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="338" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="338" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >3</text><text x="355" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Plan</text><text x="332" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >intent · lenses</text><text x="332" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M454,211.0 L458,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="460" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="480" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="480" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >4</text><text x="497" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Lenses</text><text x="474" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >file reviewers</text><text x="474" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" >flow worker</text><path d="M596,211.0 L600,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="602" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="622" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="622" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >5</text><text x="639" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Cross-file</text><text x="616" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >API drift</text><text x="616" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M738,211.0 L742,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="744" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="764" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="764" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >6</text><text x="781" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Investigate</text><text x="758" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >picks evidence</text><text x="758" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M880,211.0 L884,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="886" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="906" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="906" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >7</text><text x="923" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Verify</text><text x="900" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >adversarial pass</text><text x="900" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" >flow worker</text><path d="M1022,211.0 L1026,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="1028" y="168" width="134" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="1048" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="1048" y="194.5" class="t" font-size="14.5" font-weight="700" text-anchor="middle" fill="#7c5cff" >8</text><text x="1065" y="195" class="t" font-size="17" font-weight="650" text-anchor="start" >Synthesize</text><text x="1042" y="224" class="s" font-size="14" font-weight="400" text-anchor="start" >verdict</text><text x="1042" y="241" class="m" font-size="13" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M243.0,168 L243.0,142" fill="none" stroke="#eda100" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="145.0" y="118" width="182.0" height="24" rx="12" fill="#3a2c0c" stroke="#eda100" stroke-width="1" /><text x="236.0" y="135" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#eda100" >static hits → drafts</text><path d="M527.0,254 C527.0,280 415.0,276 415.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="363.0" y="310" width="104" height="28" rx="14" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="415.0" y="329" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" >correctness</text><path d="M527.0,254 C527.0,280 527.0,276 527.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="475.0" y="310" width="104" height="28" rx="14" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="527.0" y="329" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" >security</text><path d="M527.0,254 C527.0,280 639.0,276 639.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="587.0" y="310" width="104" height="28" rx="14" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="639.0" y="329" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" >reliability</text><text x="527.0" y="362" class="s" font-size="14" font-weight="400" text-anchor="middle" >each reviewer is an obj whose bound methods</text><text x="527.0" y="378" class="s" font-size="14" font-weight="400" text-anchor="middle" >read_file · search_code · file_history are its tools</text><path d="M811.0,254 L811.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#av)"/><rect x="705.0" y="310" width="226" height="50" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.2" /><text x="818.0" y="331" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" >visit [here--&gt;][?:CodeRef]</text><text x="818.0" y="350" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#7c5cff" >by llm(select=(1, 3))</text><path d="M953.0,168 L953.0,142" fill="none" stroke="#e66767" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="849.0" y="118" width="208" height="24" rx="12" fill="#3a1717" stroke="#e66767" stroke-width="1" /><text x="953.0" y="135" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#e66767" >✕ drops false positives</text><path d="M1095.0,254 L1095.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" marker-end="url(#av)"/><rect x="1011.0" y="310" width="152" height="50" rx="10" fill="#2a2347" stroke="#7c5cff" stroke-width="1.2" /><text x="1087.0" y="331" class="m" font-size="14" font-weight="600" text-anchor="middle" fill="#ecebf3" >request_changes</text><text x="1087.0" y="350" class="m" font-size="13.5" font-weight="500" text-anchor="middle" fill="#b9b6c9" >risk 95 · $0.13</text><text x="34" y="430" class="s" font-size="14.5" font-weight="400" text-anchor="start" >Budget-capped per review (DIFFWALKER_REVIEW_BUDGET); typed outputs re-ask the model on a malformed reply.</text></svg>