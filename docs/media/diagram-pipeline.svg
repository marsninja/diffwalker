<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 452" width="1180" height="452" role="img" aria-label="Eight-stage review pipeline: ingest and triage are deterministic; plan, parallel lenses, cross-file, investigate, verify and synthesize are typed LLM calls. The verifier drops false positives.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ecebf3}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b9b6c9}
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8a879c}
  .flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a879c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c5cff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1baf7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e66767"/></marker><radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><rect width="1180" height="452" rx="18" fill="#0f0e15"/><rect width="1180" height="452" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="1179" height="451" rx="18" fill="none" stroke="#2c2a38"/><text x="34" y="50" class="t" font-size="22" font-weight="700" text-anchor="start" >The review pipeline</text><text x="34" y="76" class="s" font-size="14" font-weight="400" text-anchor="start" >Eight stages, each committed to the graph as it finishes, so every open screen follows along.</text><rect x="740" y="38" width="14" height="14" rx="4" fill="#11302a" stroke="#1baf7a" stroke-width="1.2" /><text x="762" y="50" class="s" font-size="12.5" font-weight="400" text-anchor="start" >deterministic Jac</text><rect x="888" y="38" width="14" height="14" rx="4" fill="#2a2347" stroke="#7c5cff" stroke-width="1.2" /><text x="910" y="50" class="s" font-size="12.5" font-weight="400" text-anchor="start" >typed by llm() call</text><rect x="1048" y="38" width="14" height="14" rx="4" fill="#3a1717" stroke="#e66767" stroke-width="1.2" /><text x="1070" y="50" class="s" font-size="12.5" font-weight="400" text-anchor="start" >rejections</text><rect x="36" y="168" width="128" height="86" rx="14" fill="#11302a" stroke="#1baf7a" stroke-width="1.4" /><circle cx="56" cy="190" r="11" fill="#0f0e15" stroke="#1baf7a"/><text x="56" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#1baf7a" >1</text><text x="74" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Ingest</text><text x="50" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >git diff → FileDiff</text><text x="50" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M166,211.0 L174,211.0" fill="none" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#ag)"/><rect x="176" y="168" width="128" height="86" rx="14" fill="#11302a" stroke="#1baf7a" stroke-width="1.4" /><circle cx="196" cy="190" r="11" fill="#0f0e15" stroke="#1baf7a"/><text x="196" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#1baf7a" >2</text><text x="214" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Triage</text><text x="190" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >risk + CodeRefs</text><text x="190" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M306,211.0 L314,211.0" fill="none" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#ag)"/><rect x="316" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="336" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="336" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >3</text><text x="354" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Plan</text><text x="330" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >intent · lenses</text><text x="330" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M446,211.0 L454,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="456" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="476" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="476" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >4</text><text x="494" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Lenses</text><text x="470" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >file reviewers</text><text x="470" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" >flow worker</text><path d="M586,211.0 L594,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="596" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="616" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="616" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >5</text><text x="634" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Cross-file</text><text x="610" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >API drift</text><text x="610" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M726,211.0 L734,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="736" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="756" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="756" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >6</text><text x="774" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Investigate</text><text x="750" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >walker reads code</text><text x="750" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M866,211.0 L874,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="876" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="896" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="896" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >7</text><text x="914" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Verify</text><text x="890" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >adversarial pass</text><text x="890" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" >flow worker</text><path d="M1006,211.0 L1014,211.0" fill="none" stroke="#7c5cff" stroke-width="1.8" marker-end="url(#av)"/><rect x="1016" y="168" width="128" height="86" rx="14" fill="#2a2347" stroke="#7c5cff" stroke-width="1.4" /><circle cx="1036" cy="190" r="11" fill="#0f0e15" stroke="#7c5cff"/><text x="1036" y="194.5" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#7c5cff" >8</text><text x="1054" y="195" class="t" font-size="15" font-weight="650" text-anchor="start" >Synthesize</text><text x="1030" y="224" class="s" font-size="11.5" font-weight="400" text-anchor="start" >verdict</text><text x="1030" y="241" class="m" font-size="10.5" font-weight="400" text-anchor="start" fill="#8a879c" ></text><path d="M240.0,168 L240.0,142" fill="none" stroke="#eda100" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="188.0" y="120" width="141.0" height="20" rx="10" fill="#3a2c0c" stroke="#eda100" stroke-width="1" /><text x="258.5" y="134" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#eda100" >static hits → drafts</text><path d="M520.0,254 C520.0,280 426.0,276 426.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="384.0" y="310" width="84" height="26" rx="13" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="426.0" y="327.5" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#b9b6c9" >correctness</text><path d="M520.0,254 C520.0,280 520.0,276 520.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="478.0" y="310" width="84" height="26" rx="13" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="520.0" y="327.5" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#b9b6c9" >security</text><path d="M520.0,254 C520.0,280 614.0,276 614.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" class="flow" marker-end="url(#av)"/><rect x="572.0" y="310" width="84" height="26" rx="13" fill="#17161f" stroke="#7c5cff" stroke-width="1.1" /><text x="614.0" y="327.5" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#b9b6c9" >reliability</text><text x="520.0" y="362" class="s" font-size="11.5" font-weight="400" text-anchor="middle" >each reviewer is an obj whose bound methods</text><text x="520.0" y="378" class="s" font-size="11.5" font-weight="400" text-anchor="middle" >read_file · search_code · file_history are its tools</text><path d="M800.0,254 L800.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#av)"/><rect x="714.0" y="310" width="172" height="44" rx="10" fill="#17161f" stroke="#2c2a38" stroke-width="1.2" /><text x="800.0" y="328" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#b9b6c9" >visit [here--&gt;][?:CodeRef]</text><text x="800.0" y="344" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#7c5cff" >by llm(select=(1, 3))</text><path d="M940.0,168 L940.0,142" fill="none" stroke="#e66767" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="862.0" y="120" width="156" height="20" rx="10" fill="#3a1717" stroke="#e66767" stroke-width="1" /><text x="940.0" y="134" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#e66767" >✕ drops false positives</text><path d="M1080.0,254 L1080.0,308" fill="none" stroke="#7c5cff" stroke-width="1.3" marker-end="url(#av)"/><rect x="1016.0" y="310" width="128" height="44" rx="10" fill="#2a2347" stroke="#7c5cff" stroke-width="1.2" /><text x="1080.0" y="328" class="m" font-size="11.5" font-weight="600" text-anchor="middle" fill="#ecebf3" >request_changes</text><text x="1080.0" y="344" class="m" font-size="11" font-weight="500" text-anchor="middle" fill="#b9b6c9" >risk 95 · $0.13</text><text x="34" y="430" class="s" font-size="12" font-weight="400" text-anchor="start" >Budget-capped per review (DIFFWALKER_REVIEW_BUDGET); typed outputs re-ask the model on a malformed reply.</text></svg>